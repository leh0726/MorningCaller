plugins {
    id 'com.android.application'
}

android {
    namespace 'com.w401.morningcaller'
    compileSdk 34

    defaultConfig {
        applicationId 'com.w401.morningcaller'
        minSdk 26          // Android 8.0
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 서명 키 정보는 저장소가 아닌 %USERPROFILE%\.gradle\gradle.properties 에 둔다.
    // (scripts\create-signing-key.bat 가 키를 만들고 이 값들을 써 준다)
    def hasReleaseKey = project.hasProperty('MC_STORE_FILE')

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(MC_STORE_FILE)
                storePassword MC_STORE_PASSWORD
                keyAlias MC_KEY_ALIAS
                keyPassword MC_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 키 설정이 있으면 전용 키, 없으면(다른 PC·CI) 디버그 키로 서명
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
